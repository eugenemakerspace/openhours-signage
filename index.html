<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eugene Makerspace - Open Hours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <img src="assets/ems-logo.svg" alt="Eugene Makerspace" class="header-logo">
  </header>

  <main id="day-list-container">
    <ul class="day-list" id="day-list">
      <li class="day-row day-previous">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-today empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
      <li class="day-row day-future empty">
        <h4 class="day-date"></h4>
        <section class="day-events"></section>
        <section class="day-open-hours"></section>
      </li>
    </ul>
  </main>

  <footer class="footer">
    <div class="footer-contact">
      <span>web: <code>https://eugenemakerspace.com</code></span>
      <span>email: <code>info@eugenemakerspace.com</code></span>
    </div>
    <div class="footer-qr">
      <p class="qr-label">Scan for more info</p>
      <img src="assets/moreinfo-qrcode.png" alt="QR code for more info" class="qr-image">
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
